# Parser fixtures: release name -> the fields it must produce. Fields not listed are not checked.
# Hand-written; names follow common fansub and scene conventions. No release site was consulted.
cases:
  # Season and episode joined by a hyphen (Moozzi2, Erai-raws, Ohys-Raws, NanakoRaws).
  - name: "[Moozzi2] Spy x Family S2-07 [ 32 ] [BD 1920x1080 x265-10Bit Flac]"
    expect: { group: Moozzi2, title: Spy x Family, season: 2, episode: 7 }
  - name: "[Erai-raws] Spy x Family Season 3-13 [1080p CR WEB-DL AVC AAC][MultiSub][C2A05068]"
    expect: { title: Spy x Family, season: 3, episode: 13 }
  - name: "[Ohys-Raws].Spy.x.Family.2nd-02.TX.1280x720.x264.AAC"
    expect: { title: Spy x Family, season: 2, episode: 2 }
  - name: "[NanakoRaws].Spy.x.Family.S2-12v2.END.WEB-DL.1920x1080.x264.AAC"
    expect: { title: Spy x Family, season: 2, episode: 12, version: 2 }
  - name: "[Kosaka].Spy.x.Family.Season.2-12-Part.of.the.Family.1080p.AV1.10Bit.OPUS.[Dual-Audio]"
    expect: { title: Spy x Family, season: 2, episode: 12 }
  # A number glued to the title by a hyphen, in a name with spaces, or with an episode title or tags after it.
  - name: "[ASW] Spy x Family-47v2 [1080p HEVC][130312BD]"
    expect: { title: Spy x Family, season: null, episode: 47, version: 2 }
  - name: "[SubsPlease].Spy.x.Family-12.480p"
    expect: { title: Spy x Family, episode: 12 }
  - name: "[Kosaka].Spy.x.Family-12-Penguin.Park.1080p.AV1.10Bit.OPUS.[A35BF4C4]"
    expect: { title: Spy x Family, episode: 12 }
  - name: "[Rowlis] Spy x Family-S03 [1080p WEB OPUS AV1 10-bit]"
    expect: { title: Spy x Family, season: 3, episode: null, batch: true }
  # A zero is not an episode, and a codec's "-10Bit" is not one either.
  - name: "[Group] Mobile Suit Gundam-00 [1080p]"
    expect: { title: Mobile Suit Gundam-00, episode: null }
  # Scene-style dotted names put the episode between the title and the tags.
  - name: "Bleach-Thousand-Year.Blood.War.35.BD.Remux.1080p.AVC.DTS-HD.MA.2.0.DUAL.DTS-HD.MA.2.0-Wwecrazzy"
    expect: { title: Bleach-Thousand-Year Blood War, episode: 35, source: bd, group: Wwecrazzy }
  - name: "Show.Name.05.1080p.WEB-DL-GRP"
    expect: { title: Show Name, episode: 5, group: GRP }
  # A zero is not an episode.
  - name: "Mobile.Suit.Gundam.00.1080p.BluRay-GRP"
    expect: { title: Mobile Suit Gundam 00, episode: null }
  # H.264 keeps its dot in a dot-separated name, so the codec and group after it are tags, not title.
  - name: "Dara.san.of.the.Reiwa.Era.S01.1080p.CR.WEB-DL.AAC2.0.H.264-VARYG"
    expect: { title: Dara san of the Reiwa Era, season: 1, episode: null, resolution: 1080p, video_codec: h264, group: VARYG, batch: true }
  # A hyphen episode followed by a hyphen and tags, and "Ep-05".
  - name: "[AniDL].Dance.in.the.Vampire.Bund-05-[720p][BD][D-A][CTR]"
    expect: { title: Dance in the Vampire Bund, episode: 5 }
  - name: "[Mr.Deadpool].Ascendance.of.a.Bookworm.Ep-05.Dual.Audio.720p.x265"
    expect: { title: Ascendance of a Bookworm, episode: 5 }
  - name: "[Group] Show Name 2nd Season [BD 1080p]"
    expect: { title: Show Name, season: 2, episode: null, batch: true }
  - name: "[Group] Show Name 2nd Season Movie [BD 1080p]"
    expect: { season: 2, special: movie, batch: false }
  # Erai-raws writes dot-separated names with the episode glued to the title by a hyphen.
  - name: "[Erai-raws].Tempal-Item.no.Chikara-03.[720p.CR.WEB-DL.AVC.AAC][MultiSub][4F82E2DE]"
    expect: { group: Erai-raws, title: Tempal-Item no Chikara, episode: 3, season: null, resolution: 720p, checksum: 4F82E2DE }
  - name: "[Erai-raws].Psyren-03.[1080p.CR.WEBRip.HEVC.AAC][MultiSub][A4F9929A]"
    expect: { title: Psyren, episode: 3 }
  - name: "[Erai-raws].Bleach-Sennen.Kessen.Hen-Kashin.Tan-09.[480p.DSNP.WEB-DL.AVC.AAC][MultiSub][3850FF2D]"
    expect: { title: Bleach-Sennen Kessen Hen-Kashin Tan, episode: 9 }
  - name: "[Erai-raws].Show.Name-05v2.[1080p.CR.WEB-DL.AVC.AAC][MultiSub]"
    expect: { title: Show Name, episode: 5, version: 2 }
  # A hyphen and digits are not an episode in other names: a year, or a name with spaces.
  - name: "[Group].Show.Name-2024.[1080p]"
    expect: { title: Show Name-2024, episode: null }
  - name: "[Group] Mobile Suit Gundam-00 - 03 [1080p]"
    expect: { title: Mobile Suit Gundam-00, episode: 3 }
  # Chinese fansubs: 第13话 is episode 13.
  - name: "[Doomdos] - 成也萧河 - 第13话 - [1080p BILIBILI COM WEB-DL]"
    expect: { group: Doomdos, title: 成也萧河, episode: 13 }
  # An audio tag with a dot between codec and channels is a tag, not part of the title.
  - name: "Starmyu.in.Halloween.2018.1080p.JPN.BluRay.AVC.LPCM.2.0-NAN0"
    expect: { title: Starmyu in Halloween, year: 2018, group: NAN0, resolution: 1080p }
  - name: "[SubsPlease] Spy x Family - 13 (1080p) [ABCD1234].mkv"
    expect: { group: SubsPlease, title: Spy x Family, episode: 13, resolution: 1080p, checksum: ABCD1234, extension: mkv, batch: false }
  - name: "[Erai-raws] Sousou no Frieren - 05v2 [1080p][Multiple Subtitle][CAFE1234].mkv"
    expect: { group: Erai-raws, title: Sousou no Frieren, episode: 5, version: 2, resolution: 1080p, checksum: CAFE1234 }
  - name: "[SubsPlease] Kusuriya no Hitorigoto S2 - 01 (1080p) [AB12CD34].mkv"
    expect: { title: Kusuriya no Hitorigoto, season: 2, episode: 1 }
  - name: "[Group] Show 2nd Season - 03 [1080p]"
    expect: { title: Show, season: 2, episode: 3 }
  - name: "[Group] Show Season 3 - 07 [720p]"
    expect: { title: Show, season: 3, episode: 7, resolution: 720p }
  - name: "[Group] Spy x Family Part 2 - 01 [720p]"
    expect: { title: Spy x Family, part: 2, season: null, episode: 1 }
  - name: "[Group] Some Show Cour 2 - 05 [1080p]"
    expect: { title: Some Show, part: 2, episode: 5 }
  - name: "[Group] Overlord II - 04 [1080p]"
    expect: { title: Overlord, season: 2, episode: 4 }
  - name: "Attack on Titan S02E05 1080p WEB-DL AAC2.0 H.264"
    expect: { title: Attack on Titan, season: 2, episode: 5, resolution: 1080p, source: webdl, video_codec: h264, audio: [aac2.0] }
  - name: "Show.Name.S01E02v2.1080p.WEB.x264-GRP.mkv"
    expect: { group: GRP, title: Show Name, season: 1, episode: 2, version: 2, source: web, video_codec: x264 }
  - name: "One.Piece.E1100.1080p.WEB.H264-GRP.mkv"
    expect: { group: GRP, title: One Piece, episode: 1100, resolution: 1080p }
  - name: "[Group] One Piece 1100 [1080p]"
    expect: { title: One Piece, episode: 1100 }
  - name: "[Group] Long Show - 1000 [1080p]"
    expect: { title: Long Show, episode: 1000 }
  - name: "[Group] Show Name - 01-12 [BD 1080p] [Batch]"
    expect: { title: Show Name, episode: 1, episode_to: 12, batch: true, source: bd, flags: [batch] }
  - name: "[Group] Show Name - 01 ~ 24 [1080p]"
    expect: { title: Show Name, episode: 1, episode_to: 24, batch: true }
  - name: "[Group] Show Name (01-13) [BD 1080p]"
    expect: { title: Show Name, episode: 1, episode_to: 13, batch: true }
  - name: "[Judas] Shingeki no Kyojin (Season 1) [BD 1080p][HEVC x265 10bit][Dual-Audio][Eng-Subs] (Batch)"
    expect: { group: Judas, title: Shingeki no Kyojin, season: 1, episode: null, batch: true, video_codec: hevc, flags: [10bit, dual-audio, batch] }
  - name: "[Group] Kimi no Na wa. (2016) [BD 1080p FLAC]"
    expect: { title: Kimi no Na wa., year: 2016, episode: null, audio: [flac] }
  - name: "Kimi.no.Na.wa.2016.1080p.BluRay.x264-GRP"
    expect: { title: Kimi no Na wa, year: 2016, episode: null, source: bluray }
  - name: "[Group] Some Movie (2019) [1080p]"
    expect: { title: Some Movie, year: 2019, episode: null, special: movie }
  - name: "[Group] Frieren - SP2 [1080p]"
    expect: { title: Frieren, episode: 2, special: special }
  - name: "[Group] Show OVA - 02 [720p]"
    expect: { title: Show OVA, episode: 2, special: ova }
  - name: "[Group] Show - OVA 1 [720p]"
    expect: { title: Show, episode: 1, special: ova }
  - name: "[Group] Show Movie [1080p]"
    expect: { title: Show Movie, special: movie, episode: null }
  - name: "[ASW] Dandadan - 13 [1080p HEVC x265 10Bit][AAC]"
    expect: { group: ASW, title: Dandadan, episode: 13, video_codec: hevc, audio: [aac], flags: [10bit] }
  - name: "[Group] Show Name - 05 (BD 1080p Dual Audio) [ABCDEF12]"
    expect: { episode: 5, source: bd, checksum: ABCDEF12 }
  - name: "[Group] Show Name - Episode 07 [1080p]"
    expect: { title: Show Name, episode: 7 }
  - name: "[Group] Show Name EP09 [1080p]"
    expect: { title: Show Name, episode: 9 }
  - name: "[Group] Show Name #10 [1080p]"
    expect: { title: Show Name, episode: 10 }
  - name: "[Group]_Show_Name_-_11_[720p].mkv"
    expect: { group: Group, title: Show Name, episode: 11, resolution: 720p }
  - name: "Re:Zero kara Hajimeru Isekai Seikatsu - 26 [1080p]"
    expect: { group: null, title: "Re:Zero kara Hajimeru Isekai Seikatsu", episode: 26 }
  - name: "[Group] Steins;Gate 0 - 03 [1080p]"
    expect: { title: "Steins;Gate 0", episode: 3 }
  - name: "[Group] 86 - 05 [1080p]"
    expect: { title: "86", episode: 5 }
  - name: "/downloads/anime/[Group] Show Name - 04 [1080p].mkv"
    expect: { group: Group, title: Show Name, episode: 4, extension: mkv }
  - name: "[1080p] Show Name - 06"
    expect: { group: null, title: Show Name, episode: 6, resolution: 1080p }
  - name: "【Group】 Show Name - 08 【1080p】"
    expect: { group: Group, title: Show Name, episode: 8, resolution: 1080p }
  - name: "[Group] Show Name - 12.5 [1080p]"
    expect: { title: Show Name, episode: 12 }
  - name: "Show Name - 03 [Uncensored][1080p]"
    expect: { title: Show Name, episode: 3, flags: [uncensored] }
  # An RSS title can carry HTML entities: "&amp;" is "&". A year and SxxExx follow.
  - name: "Ranma1.&amp;.2.2024.S03E04.The.Way.of.Tea.1080p.NF.WEB-DL.AAC2.0.H.264-playWEB"
    expect: { title: "Ranma1 &.2", season: 3, episode: 4, year: 2024, group: playWEB }
  # Amazon's "Original Language" marker sits before the episode.
  - name: "Saint.Tail.Original.Language.S01E40.Moms.Secret.1080p.AMZN.WEB-DL"
    expect: { title: Saint Tail, season: 1, episode: 40, source: webdl }
  # A movie with no episode: the tags after the year are metadata, not part of the title.
  - name: "Pompo.The.Cinephile.2021.BluRay.1080p.TrueHD.5.1.AVC.HYBRID.REMUX-FraMeSToR"
    expect: { title: Pompo The Cinephile, year: 2021, source: bluray, resolution: 1080p, group: FraMeSToR, flags: [remux] }
  # "[2026]-03": a year tag, then a hyphen glued to the episode.
  - name: "[Erai-raws].Magic.Knight.Rayearth.[2026]-03.[1080p.CR.WEBRip.HEVC.AAC][MultiSub][19EF5258]"
    expect: { title: Magic Knight Rayearth, year: 2026, episode: 3, source: webrip, checksum: "19EF5258" }
  # A year and a special marker at the end of a release with no episode are metadata.
  - name: "Iczer.One.1985.OVA.FRA.PAL.DVD5.DD.2.0-ieoia"
    expect: { title: Iczer One, year: 1985, special: ova, group: ieoia }
  # A season pack from a MSubs web group: the subtitle tag and the tags before it leave the title.
  - name: "As.a.Reincarnated.Aristocrat.Ill.Use.My.Appraisal.Skill.to.Rise.in.the.World.S01.1080p.CR.WEB-DL.DUAL.AAC2.0.H.264.MSubs-ToonsHub"
    expect: { title: As a Reincarnated Aristocrat Ill Use My Appraisal Skill to Rise in the World, season: 1, batch: true, group: ToonsHub }
  # A roman numeral in the title does not override the explicit season.
  - name: "The.Prince.of.Tennis.II.2012.S05E02.1080p.CR.WEB-DL.DUAL.DDP2.0.H.264-AnoZu"
    expect: { title: The Prince of Tennis II, season: 5, episode: 2, year: 2012, group: AnoZu }
  # A range before "Complete" is a batch of episodes, not a number glued to the title.
  - name: "[anime4life.] Black Lagoon 1-29 Complete (BDRip 1080p AC3 10bit) [HEVC] Dual Audio"
    expect: { title: Black Lagoon, episode: 1, episode_to: 29, batch: true, group: "anime4life." }
  # A streaming service's own tag (Bahamut, Netflix, ADN) is metadata, not part of the title (proxy export 2026-10-28).
  - name: "Dandadan.S01.2024.1080p.Baha.WEB-DL.x264.AAC-ADWeb"
    expect: { title: Dandadan, season: 1, episode: null, year: 2024, batch: true, group: ADWeb }
  - name: "Dan.da.dan.S01.2024.Complete.1080p.Netflix.WEB-DL.AVC.AAC.2.0-DBTV"
    expect: { title: Dan da dan, season: 1, episode: null, year: 2024, batch: true, group: DBTV }
  - name: "The.Dangers.in.My.Heart.The.Movie.2026.1080p.ADN.WEB-DL.DUAL.DDP5.1.H.264-VARYG"
    expect: { title: The Dangers in My Heart The Movie, year: 2026, group: VARYG }
  # Whole language words are tags in a scene name; a release version after the season is not part of the title.
  - name: "One.Piece.S02.DANiSH.ENGLiSH.JAPANESE.1080p.WEB-DL.H.264.DDP2.0-NoTrace"
    expect: { title: One Piece, season: 2, episode: null, batch: true, group: NoTrace }
  - name: "Dandadan.S01.2025.V2.1080p.WEB-DL.H.264.AAC-ADWeb"
    expect: { title: Dandadan, season: 1, episode: null, year: 2025, batch: true, group: ADWeb }
  # "ESub" is a subtitle tag, like "MSubs".
  - name: "The.Dangers.in.My.Heart.The.Movie.2026.1080p.HIDIVE.WEB-DL.DUAL.AAC2.0.H.264.ESub-ToonsHub"
    expect: { title: The Dangers in My Heart The Movie, year: 2026, group: ToonsHub }
  # Sonarr's own "1x12" form: season and episode, never a resolution.
  - name: "Dan.Da.Dan.1x12"
    expect: { title: Dan Da Dan, season: 1, episode: 12 }
  - name: "Digimon Digital Monsters - 1x11 - The Dancing Digimon"
    expect: { title: Digimon Digital Monsters, season: 1, episode: 11 }
  - name: "[Group] Show Name - 05 [1280x720 x264]"
    expect: { title: Show Name, season: null, episode: 5, resolution: 1280x720 }
  # "Season.1" in a dotted name is a season, not a decimal; "Dual Audio" after it is two tag words.
  - name: "[neoDESU].Dandadan.Season.1.BD.1080p.x265.HEVC.OPUS.AAC.Dual.Audio"
    expect: { title: Dandadan, season: 1, episode: null, batch: true, group: neoDESU }
  - name: "Dandadan S02 1080p Dual Audio WEBRip DD+ x265-EMBER"
    expect: { title: Dandadan, season: 2, episode: null, batch: true, group: EMBER, flags: [dual-audio, batch] }
  # A glued season followed by more tags: "Title-S02-1080p".
  - name: "[Cryon] Dan Da Dan-S02-1080p BluRay AV1 Opus 2.0 Dual Audio"
    expect: { title: Dan Da Dan, season: 2, episode: null, batch: true, group: Cryon }
  # A slash inside brackets is not a path separator.
  - name: "[Trix] Blue Box S02E04 1080p NF WEB-DL Opus2.0 AV1 (Multi-Audio / Dual-Audio, Multi-Subs) (Ao no Hako Season 2) (Weekly)"
    expect: { title: Blue Box, season: 2, episode: 4, group: Trix }
  # A year between the title and the season is the year, not part of the title.
  - name: "Kingdom.2012.S02.1080p.CR.WEB-DL.DUAL.DDP2.0.H.264-Kitsune"
    expect: { title: Kingdom, season: 2, episode: null, year: 2012, batch: true, group: Kitsune }
  # A two-digit episode before a bare resolution word (no brackets around it).
  - name: "[ShouryuuReppa] Tokyo Revengers Seiya Kessen-hen 13 1080p [Multi-subs][h264 qsv][8bit][AAC]"
    expect: { title: Tokyo Revengers Seiya Kessen-hen, episode: 13, group: ShouryuuReppa }
  # "Hi10" as a leading profile tag.
  - name: "Hi10.Fate.Stay.Night.Unlimited.Blade.Works-03.BD.720p.Dekinai.A5D015CF"
    expect: { title: Fate Stay Night Unlimited Blade Works, episode: 3 }
