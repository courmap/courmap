notes: >-
  Adds the romaji and English titles run together, the way Anitsu and SanKyuu
  ("Ore.dake.Level.Up.na.Ken.Solo.Leveling-08") and Raze ("Solo.Leveling.Ore.dake.Level.Up.na.Ken-01")
  name their releases. Both halves are this work's own seed title and seed alias "Solo Leveling", and
  no other seed work has either combination; the second cour has its own "Season 2" titles. Episodes
  1 to 12 are TheTVDB 389597 season 1 (the seed's mapping, from Anime-Lists).
