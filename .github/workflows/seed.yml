name: seed

# Weekly: rebuild data/seeds/ from the newest cedya77 release and Anime-Lists commit, and open
# (or update) a pull request with the diff. Never pushes to main.
on:
  schedule:
    # Off the hour and half hour: GitHub delays or drops scheduled runs at busy minutes.
    - cron: '17 6 * * 2' # Tuesdays 06:17 UTC, after cedya77's weekly release
  workflow_dispatch:

permissions:
  contents: write # push the seed/* branch
  pull-requests: write

concurrency:
  group: seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pushes with the built-in token do not trigger the validate workflow on the seed PR.
          token: ${{ secrets.SEED_PR_TOKEN || github.token }}

      - name: Check the PR token
        env:
          GH_TOKEN: ${{ secrets.SEED_PR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SEED_PR_TOKEN is not set; the PR step falls back to the built-in token."
            exit 0
          fi
          push=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push // "unknown"') || { echo "::error::SEED_PR_TOKEN does not authenticate for $GITHUB_REPOSITORY"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/pulls?per_page=1" --jq length >/dev/null || { echo "::error::SEED_PR_TOKEN cannot read pull requests"; exit 1; }
          echo "::notice::SEED_PR_TOKEN authenticates for $GITHUB_REPOSITORY (push: $push) and can read pull requests."

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache seed downloads
        uses: actions/cache@v4
        with:
          path: .cache/seed
          key: seed-${{ github.run_id }}
          restore-keys: seed-

      - name: Seed from the latest pins (two runs, must be byte-identical)
        run: pnpm seed --latest --verify --report "$RUNNER_TEMP/seed-report.md"
        env:
          GITHUB_TOKEN: ${{ github.token }} # read-only GitHub API calls to resolve the pins

      - name: Same checks as the validate workflow
        run: pnpm check

      - name: Open or update the seed pull request
        env:
          # PRs opened with the built-in token do not trigger other workflows, and need
          # "Allow GitHub Actions to create and approve pull requests" in the repo settings.
          # A SEED_PR_TOKEN secret (fine-grained, contents + pull requests) avoids both.
          GH_TOKEN: ${{ secrets.SEED_PR_TOKEN || github.token }}
        run: |
          if git diff --quiet -- data/seeds && [ -z "$(git ls-files --others --exclude-standard data/seeds)" ]; then
            echo "Seed output unchanged; nothing to do."
            exit 0
          fi
          tag=$(jq -r .pins.offline_db.tag data/seeds/manifest.json)
          commit=$(jq -r .pins.anime_lists.commit data/seeds/manifest.json | cut -c1-7)
          branch="seed/${tag}-${commit}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/seeds
          git commit -m "Seed data from cedya77 ${tag} and Anime-Lists ${commit}"
          git push --force origin "$branch"
          title="Seed data from cedya77 ${tag} and Anime-Lists ${commit}"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "$title" --body-file "$RUNNER_TEMP/seed-report.md"
          elif ! gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/seed-report.md" --label seed; then
            gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/seed-report.md" || {
              echo "::error::Could not open the PR. Enable 'Allow GitHub Actions to create and approve pull requests' or add a SEED_PR_TOKEN secret. The branch $branch was pushed."
              exit 1
            }
          fi
