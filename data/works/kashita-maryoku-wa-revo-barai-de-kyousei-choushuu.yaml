notes: >-
  Adds "Revo Barai", the short title Erai-raws uses ("[Erai-raws] Revo Barai - 06", CR WEB-DL).
  It is the bracketed part of the seed's own romaji title, and no other seed work has it. TheTVDB
  470347 (the seed's mapping, from Anime-Lists) lists this show as continuing, first aired
  2026-10-04, with 12 episodes in season 1.
