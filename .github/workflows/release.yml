name: release

# Weekly data release (docs/SPEC.md, "Release"; decision S6.2):
#   publish: compile the dump, build and verify the release assets, and publish the GitHub
#            release data-<data_version> with them. Needs no R2 secrets.
#   r2:      sync the static shards to R2, meta.json last. A dry run (upload plan only) until all
#            four R2 secrets exist.
#   r2-tag:  run by hand with a tag (gh workflow run release.yml -f tag=data-2026.43): rebuild the
#            shards from that release's published dump, check they match its meta.json, and sync
#            them to R2. Publishes nothing on GitHub.
on:
  schedule:
    # Off the hour and half hour: GitHub delays or drops scheduled runs at busy minutes.
    - cron: '13 9 * * 2' # Tuesdays 09:13 UTC, after the seed job (06:17)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Sync an existing release to R2 instead of publishing (for example data-2026.43)'
        required: false
        default: ''

permissions:
  contents: write # create the GitHub release and its tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.tag == '' || inputs.tag == null
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.assets.outputs.version }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Same checks as the validate workflow
        run: pnpm check

      - name: Compile the dump
        run: pnpm compile --out out/courmap.sqlite

      - name: Generate the static shards
        run: pnpm builder shards --from out/courmap.sqlite --out out/shards/v1

      - name: Build the release assets and point meta.json at them
        id: assets
        run: |
          pnpm release assets --dump out/courmap.sqlite --out out/release
          pnpm release meta --dir out/shards/v1 --assets out/release --repo "$GITHUB_REPOSITORY"
          version=$(jq -r .data_version out/release/meta.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=data-$version" >> "$GITHUB_OUTPUT"

      - name: Verify every asset before publishing
        run: pnpm release verify --dir out/release --repo "$GITHUB_REPOSITORY"

      - name: Keep the assets and shards as workflow artifacts
        run: tar -czf out/shards.tar.gz -C out shards

      - uses: actions/upload-artifact@v4
        with:
          name: courmap-${{ steps.assets.outputs.version }}
          path: out/release
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: shards-${{ steps.assets.outputs.version }}
          path: out/shards.tar.gz
          retention-days: 7

      # One release per data version. Shards and dumps are immutable within a data version, so a
      # tag that already exists on another commit stops here; on the same commit (a rerun after a
      # failed R2 sync) the release is kept and the R2 job runs again.
      - name: Publish the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            tagged=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::warning::$TAG already exists on ${tagged:0:7}; this commit (${GITHUB_SHA:0:7}) ships with the next data version."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$TAG already exists on this commit; keeping it."
          else
            gh release create "$TAG" out/release/* \
              --target "$GITHUB_SHA" \
              --latest \
              --title "Data ${TAG#data-}" \
              --notes "Courmap data release ${TAG#data-}: the SQLite and JSON dumps, meta.json and checksums. The data is licensed ODbL 1.0 + DbCL 1.0 (DATA_LICENSE, with ATTRIBUTION.md); the code is Apache-2.0 (LICENSE). Verify downloads with \`sha256sum -c SHA256SUMS\`."
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The README reads its data, coverage and corpus badges from the badges branch: one commit,
      # replaced on every release, so main never gets bot commits for them.
      - name: Update the README badges
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm corpus --json out/corpus.json > /dev/null
          gh issue list --label season-tracker --state open --json title,body > out/trackers.json || echo '[]' > out/trackers.json
          pnpm release badges --out out/badges --meta out/release/meta.json --corpus out/corpus.json --trackers out/trackers.json
          cd out/badges
          git init -q -b badges
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Badges for ${{ steps.assets.outputs.tag }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  r2:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      S3_BUCKET: ${{ secrets.R2_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: shards-${{ needs.publish.outputs.version }}
          path: out

      - run: tar -xzf out/shards.tar.gz -C out

      - name: Sync the shards to R2 (meta.json last), or print the plan without the secrets
        run: |
          missing=""
          for s in S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::notice::R2 dry run: missing secrets (R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY). The GitHub release is published; shards are not uploaded."
          fi
          pnpm release upload --dir out/shards/v1 --prune

  r2-tag:
    if: inputs.tag != '' && inputs.tag != null
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      S3_BUCKET: ${{ secrets.R2_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the release and check its checksums
        run: |
          case "$TAG" in data-*) ;; *) echo "::error::$TAG is not a data release tag"; exit 1 ;; esac
          gh release download "$TAG" -D out/release
          (cd out/release && sha256sum -c SHA256SUMS)
          cp out/release/meta.json out/published-meta.json
          gunzip -c "out/release/courmap-${TAG#data-}.sqlite.gz" > out/courmap.sqlite

      # The shard generator writes exactly what DumpDataset returns, so shards built from the
      # published dump are that release's shards. meta.json must come out byte for byte the same.
      - name: Rebuild the shards from the published dump
        run: |
          pnpm builder shards --from out/courmap.sqlite --out out/shards/v1
          pnpm release meta --dir out/shards/v1 --assets out/release --repo "$GITHUB_REPOSITORY"
          if ! cmp out/published-meta.json out/shards/v1/meta.json; then
            echo "::error::The rebuilt meta.json differs from the one published with $TAG; not uploading."
            diff <(jq -S . out/published-meta.json) <(jq -S . out/shards/v1/meta.json) || true
            exit 1
          fi

      - name: Sync the shards to R2 (meta.json last), or print the plan without the secrets
        run: |
          missing=""
          for s in S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::notice::R2 dry run: missing secrets (R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY). Shards are not uploaded."
          fi
          pnpm release upload --dir out/shards/v1 --prune
