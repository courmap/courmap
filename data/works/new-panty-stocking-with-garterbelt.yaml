id: new-panty-stocking-with-garterbelt
projections:
  # TMDB lists the 13 broadcast episodes as 30 episodes in its season 1 (the segments), exactly as TVDB does in its
  # season 2; the seed mapped them one to one (1-13). The segments follow the same split as the TVDB block.
  tmdb_show:
    - { season: 1, episodes: 1 }
    - { season: 1, episodes: 2, target: "2-3" }
    - { season: 1, episodes: 3, target: "4-6" }
    - { season: 1, episodes: 4, target: "7-9" }
    - { season: 1, episodes: 5, target: "10-12" }
    - { season: 1, episodes: 6, start: 13 }
    - { season: 1, episodes: 7, target: "14-15" }
    - { season: 1, episodes: 8, target: "16-18" }
    - { season: 1, episodes: 9, target: "19-21" }
    - { season: 1, episodes: 10, target: "22-23" }
    - { season: 1, episodes: 11, target: "24-26" }
    - { season: 1, episodes: 12, target: "27-28" }
    - { season: 1, episodes: 13, target: "29-30" }
notes: >-
  Overrides the TMDB mapping only. Found by the TMDB projection checker (2026-10-21): TMDB season 1 has 30
  episodes against 13 mapped. The split is the one TVDB uses for the same 30 segments; TVDB is unchanged.
sources:
