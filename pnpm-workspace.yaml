packages:
  - packages/*
  - worker
  - site

onlyBuiltDependencies:
  - esbuild
  - sharp

# better-sqlite3 13 ships prebuilt binaries (prebuilds/, gypfile: false), so it must not be compiled: listing it in
# onlyBuiltDependencies made pnpm run node-gyp, which fails on Windows without Visual Studio.
ignoredBuiltDependencies:
  - better-sqlite3
