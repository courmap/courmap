# Resolver corpus: release name -> expected resolution. CI reports the pass rate on verified
# cases on every PR, and fails if it drops below tests/releases.baseline.json, or if any case
# expected to be ambiguous or unmatched comes back ok.
#
# Fields:
#   name       the release name, as it would appear in an RSS feed or on disk
#   expect     status ok, with work and episode (and episode_to for batches); or status
#              ambiguous, optionally with the top candidate's work; or status unmatched
#   posted     the date the release was posted; the case resolves as seen that day (a recent release
#              favors works on air now over older works with the same title)
#   dataset    data (default: data/ with seeds) or conformance (tests/conformance/data, for
#              branches the real data has no example of, such as group overrides)
#   verified   true once a person has checked the expectation; only verified cases count
#   source     hand-written, or imported (pnpm corpus:import)
#   notes      why the expectation is what it is
#
# The hand-written cases below cover every branch of the pipeline. Their names follow common
# fansub and scene conventions; no release site was consulted.
cases:
  # Exact alias
  - name: "[SubsPlease] Sousou no Frieren - 05 (1080p) [A1B2C3D4].mkv"
    expect: { status: ok, work: sousou-no-frieren, episode: 5 }
    verified: true
    source: hand-written
  - name: "[Group] Steins;Gate - 05 [BD 1080p]"
    expect: { status: ok, work: steins-gate, episode: 5 }
    verified: true
    source: hand-written
  - name: "[Group] Bocchi the Rock! - 12 [1080p]"
    expect: { status: ok, work: bocchi-the-rock, episode: 12 }
    verified: true
    source: hand-written
  - name: "[Group] SPY×FAMILY - 03 [1080p]"
    expect: { status: ok, work: spy-x-family, episode: 3 }
    verified: true
    source: hand-written
    notes: The multiplication sign folds to x (decision S3.5).
  - name: "[Group] Shingeki no Kyojin - 05 [1080p]"
    expect: { status: ok, work: shingeki-no-kyojin, episode: 5 }
    verified: true
    source: hand-written
    notes: The alias is shared with the sequels; no season token reads as the first season.
  - name: "[Group] K-On! - 03 [BD 720p]"
    expect: { status: ok, work: k-on, episode: 3 }
    verified: true
    source: hand-written
    notes: The K-On! movie shares the alias; an episode number with no movie marker favours the series.

  # Versions
  - name: "[Erai-raws] Sousou no Frieren - 05v2 [1080p][Multiple Subtitle].mkv"
    expect: { status: ok, work: sousou-no-frieren, episode: 5 }
    verified: true
    source: hand-written

  # Trigram fallback
  - name: "[Group] Kusuriya no Hitorigotto - 03 [1080p]"
    expect: { status: ok, work: kusuriya-no-hitorigoto, episode: 3 }
    verified: true
    source: hand-written
    notes: One extra letter; trigram similarity is high enough to clear the floor.
  - name: "[Group] Sousou no Frirene - 03 [1080p]"
    expect: { status: ambiguous, top: sousou-no-frieren }
    verified: true
    source: hand-written
    notes: Two letters swapped. The right work is the top candidate, but a fuzzy match this loose must not be ok.

