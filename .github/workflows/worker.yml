name: worker

# The optional Worker (worker/; decision S6.3). Bundles with Wrangler on every change; deploys
# from main when CLOUDFLARE_API_TOKEN (scoped to Workers) and CLOUDFLARE_ACCOUNT_ID exist, and is
# a dry run otherwise. It is served only at api.courmap.com (wrangler.toml turns workers.dev and
# preview addresses off). After a deploy it checks that the dashboard-managed GITHUB_DISPATCH_TOKEN
# secret is still there, then step 11's check compares the deployed Worker with the library on the
# latest data release.
on:
  push:
    branches: [main]
    paths:
      - worker/**
      - packages/client/**
      - packages/core/**
      - packages/parser/**
      - .github/workflows/worker.yml
  pull_request:
    paths:
      - worker/**
      - .github/workflows/worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Bundle with Wrangler (dry run)
        working-directory: worker
        run: npx --yes wrangler@4.151.2 deploy --dry-run --outdir dist

      - name: Deploy from main, or report the dry run
        id: deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Worker dry run: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set. The bundle was built; nothing was deployed."
            exit 0
          fi
          npx --yes wrangler@4.151.2 deploy
          echo "url=https://api.courmap.com" >> "$GITHUB_OUTPUT"

      - name: The watchdog's secret survived the deploy
        if: steps.deploy.outputs.url != ''
        working-directory: worker
        run: |
          # Secret names only; values are never readable. Set in the Cloudflare dashboard, not here.
          if npx --yes wrangler@4.151.2 secret list --format json | jq -e 'any(.[]; .name == "GITHUB_DISPATCH_TOKEN")' > /dev/null; then
            echo "GITHUB_DISPATCH_TOKEN is set on the Worker."
          else
            echo "::error::The Worker has no GITHUB_DISPATCH_TOKEN secret, so the schedule watchdog is inert. Set it in the Cloudflare dashboard (Workers & Pages, courmap, Settings, Variables and Secrets)."
            exit 1
          fi

      - name: Check the deployed Worker against the library (step 11)
        if: steps.deploy.outputs.url != ''
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if ! curl -sf -o /dev/null https://data.courmap.com/v1/meta.json; then
            echo "::notice::data.courmap.com does not serve shards yet; the deployed Worker has no data to check."
            exit 0
          fi
          curl -sfL -o courmap.sqlite.gz "$(curl -sfL https://github.com/courmap/courmap/releases/latest/download/meta.json | jq -r .dumps.sqlite.url)"
          gunzip courmap.sqlite.gz
          npx tsx --conditions=@courmap/source worker/scripts/check-deployed.ts "$WORKER_URL" courmap.sqlite --works 100
