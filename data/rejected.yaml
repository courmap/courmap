# Bot proposals a maintainer rejected (schema/rejected.schema.json). The bots read this file
# before proposing anything and never propose a matching change again; pnpm validate checks it.
# Hand-written only. To reject a bot PR: close it, then add an entry here with the reason and a
# link to the PR.
rejected:
  - kind: relation
    work: wushen-zhuzai-da-wei-pian
    prequel: wushen-zhuzai
    reason: >-
      Both works have been airing side by side since 2022 (720 and 448 episodes), so it is
      doubtful that Da Wei Pian simply follows Wushen Zhuzai, and a prequel link would feed
      absolute numbering.
    decided_by: Xwolv
    date: 2026-10-19
    link: https://github.com/courmap/courmap/pull/10
    origin: manual
  - kind: relation
    work: mahou-shoujo-ikusei-keikaku-restart
    prequel: mahou-shoujo-ikusei-keikaku
    reason: >-
      Linking restart to the 2016 series as its sequel gives it the sequel penalty in resolve, and
      the two verified corpus cases for its S01E02 and S01E03 releases (ToonsHub) turn ambiguous.
      The releases number it as a first season, so it needs a manual decision about its place in
      the chain, not an AniList prequel.
    decided_by: Xwolv
    date: 2026-10-20
    link: https://github.com/courmap/courmap/pull/34
    origin: manual
