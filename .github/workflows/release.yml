name: release

# Weekly data release (docs/SPEC.md, "Release"): compile the dump, build the release assets and
# the static shards, publish the GitHub release data-<data_version> and sync the shards to R2,
# meta.json last. Runs as a dry run (artifacts and an upload plan only) until all four R2
# secrets exist.
on:
  schedule:
    - cron: '0 9 * * 2' # Tuesdays 09:00 UTC, after the seed job (06:00)
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release and its tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Live or dry run
        id: mode
        run: |
          missing=""
          for s in R2_ENDPOINT R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -z "$missing" ]; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "Live release: all R2 secrets are set."
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run: missing secrets:$missing. No GitHub release is created and nothing is uploaded."
          fi

      - name: Same checks as the validate workflow
        run: pnpm check

      - name: Compile the dump
        run: pnpm compile --out out/courmap.sqlite

      - name: Generate the static shards
        run: pnpm builder shards --from out/courmap.sqlite --out out/shards/v1

      - name: Build the release assets
        id: assets
        run: |
          pnpm release assets --dump out/courmap.sqlite --out out/release
          version=$(jq -r .data_version out/shards/v1/meta.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=data-$version" >> "$GITHUB_OUTPUT"

      - name: Point meta.json at the release
        run: pnpm release meta --dir out/shards/v1 --assets out/release --repo "$GITHUB_REPOSITORY"

      - name: Keep the assets as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: courmap-${{ steps.assets.outputs.version }}
          path: out/release
          retention-days: 30

      # One release per data version. Shards are immutable within a data version, so a tag that
      # already exists on another commit stops the run; on the same commit (a rerun after a failed
      # upload) the release is kept and the upload resumes.
      - name: Create the GitHub release
        id: release
        if: steps.mode.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            tagged=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::warning::$TAG already exists on ${tagged:0:7}; this commit (${GITHUB_SHA:0:7}) ships with the next data version. Nothing uploaded."
              echo "upload=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$TAG already exists on this commit; resuming the shard upload."
          else
            gh release create "$TAG" out/release/* \
              --target "$GITHUB_SHA" \
              --title "Data $TAG" \
              --notes "Courmap data release ${TAG#data-}. Data license: ODbL 1.0 + DbCL 1.0 (see LICENSE and ATTRIBUTION.md). Verify downloads with \`sha256sum -c SHA256SUMS\`."
          fi
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - name: Sync the shards to R2 (meta.json last)
        if: steps.mode.outputs.live == 'true' && steps.release.outputs.upload == 'true'
        env:
          S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm release upload --dir out/shards/v1 --prune

      - name: Upload plan (dry run)
        if: steps.mode.outputs.live != 'true'
        run: pnpm release upload --dir out/shards/v1 --prune
