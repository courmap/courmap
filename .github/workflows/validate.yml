name: validate

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write # the corpus report comment

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      # S3-compatible server for the end-to-end shard upload test (packages/release).
      s3mock:
        image: adobe/s3mock:5.2.3
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: No em dashes
        run: pnpm check:dashes

      - name: Generated types are up to date
        run: pnpm check:types-fresh

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate data (schema, overlaps, gaps, bounds, round trips)
        run: pnpm validate

      - name: Compile to SQLite (row counts, integrity_check)
        run: pnpm compile --out out/courmap.sqlite

      - name: Generate static shards from the dump
        run: pnpm builder shards --from out/courmap.sqlite --out out/shards/v1

      - name: Wait for the S3-compatible test server
        run: |
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:9090/ && exit 0; sleep 1; done
          echo "::error::S3Mock did not answer on port 9090"; exit 1

      - name: Tests (broken fixtures, round trips, conformance in every mode, S3 upload)
        run: pnpm test
        env:
          S3_TEST_ENDPOINT: http://localhost:9090

      - name: Resolver corpus (verified pass rate must not drop; no ambiguous case may return ok)
        id: corpus
        run: pnpm corpus --summary "$RUNNER_TEMP/corpus.md"

      - name: Alias quality (aliases shared by more than 5 works are flagged, more than 50 excluded)
        run: pnpm builder aliases --report "$RUNNER_TEMP/aliases.md" && cat "$RUNNER_TEMP/aliases.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Report the corpus on the pull request
        if: always() && github.event_name == 'pull_request' && steps.corpus.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/corpus.md" ] || exit 0
          gh pr comment ${{ github.event.pull_request.number }} --body-file "$RUNNER_TEMP/corpus.md" --edit-last             || gh pr comment ${{ github.event.pull_request.number }} --body-file "$RUNNER_TEMP/corpus.md"

      - name: Build publishable packages
        run: pnpm build
